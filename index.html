<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#E95F0C"><meta name="color-scheme" content="light dark"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Oba Escala">
<title>Oba Escala</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap">
<style>
/* Layout: cabeçalho laranja fixo; abaixo, barra de ferramentas e a grade mensal ocupando a largura toda,
   com rolagem própria (nomes fixos à esquerda, dias fixos no topo). Painéis abrem como gaveta lateral
   no computador e como folha inferior no celular. */
:root {
  --oba: #E95F0C; --oba-deep: #B84705; --oba-ink: #FFFFFF;
  --bg: #FFFFFF; --page: #F3F0ED; --surface: #F8F6F4; --line: #E3DDD7; --line-strong: #B8AFA6;
  --fg: #1E2227; --muted: #5E656E; --focus: #1D5FC4;
  --work-bg: #EAF5EE; --work-fg: #1F7A45;
  --rest-bg: #E9E8E6; --rest-fg: #383D43;
  --sun-bg: #E2ECFA; --sun-fg: #1D5FC4;
  --hol-bg: #FFEFD6; --hol-fg: #9A4C00;
  --abs-bg: #EEE6FA; --abs-fg: #6340AE;
  --bad: #CF332B; --bad-bg: #FCE9E8;
  --ok: #1F7A45; --ok-bg: #E6F3EA;
  --warn-bg: #FFF4E2; --warn-fg: #8A4600;
  --shadow: 0 1px 2px rgba(50,30,10,.08), 0 8px 28px rgba(50,30,10,.12);
  --font-display: "Nunito", "Nunito Sans", system-ui, sans-serif;
  --font-body: "Nunito Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 12px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --oba: #D9580B; --oba-deep: #FF9A5C; --bg: #17191C; --page: #101113; --surface: #1F2226; --line: #31353B; --line-strong: #4C525A;
  --fg: #ECEEF0; --muted: #A3AAB3; --focus: #7FB0FF;
  --work-bg: #17301F; --work-fg: #8FD8A8; --rest-bg: #2A2D31; --rest-fg: #D5D8DC; --sun-bg: #172A45; --sun-fg: #8DB7FF;
  --hol-bg: #3A2A12; --hol-fg: #FFC07A; --abs-bg: #2B2140; --abs-fg: #C7AEFF; --bad: #FF6B61; --bad-bg: #3A1B19;
  --ok: #8FD8A8; --ok-bg: #17301F; --warn-bg: #3A2A12; --warn-fg: #FFC07A; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 28px rgba(0,0,0,.5); color-scheme: dark; } }
:root[data-theme="dark"] {
  --oba: #D9580B; --oba-deep: #FF9A5C; --bg: #17191C; --page: #101113; --surface: #1F2226; --line: #31353B; --line-strong: #4C525A;
  --fg: #ECEEF0; --muted: #A3AAB3; --focus: #7FB0FF;
  --work-bg: #17301F; --work-fg: #8FD8A8; --rest-bg: #2A2D31; --rest-fg: #D5D8DC; --sun-bg: #172A45; --sun-fg: #8DB7FF;
  --hol-bg: #3A2A12; --hol-fg: #FFC07A; --abs-bg: #2B2140; --abs-fg: #C7AEFF; --bad: #FF6B61; --bad-bg: #3A1B19;
  --ok: #8FD8A8; --ok-bg: #17301F; --warn-bg: #3A2A12; --warn-fg: #FFC07A; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 28px rgba(0,0,0,.5); color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { background: var(--page); color: var(--fg); }
body { font-family: var(--font-body); font-size: 14.5px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--oba); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }

/* Cabeçalho */
.hdr { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--oba); color: var(--oba-ink); }
.hdr-in { display: flex; align-items: center; gap: 10px; min-height: 58px; padding-block: 8px; flex-wrap: wrap; }
.logo { width: 34px; height: 34px; border-radius: 9px; background: #fff; display: grid; place-items: center; flex: none; }
.brand { font-family: var(--font-display); font-weight: 900; font-size: 21px; letter-spacing: -.01em; }
.store { display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 0 12px; border-radius: 17px; border: 1px solid rgba(255,255,255,.5); background: rgba(255,255,255,.14); color: #fff; font-weight: 700; font-size: 13px; max-width: 100%; }
.hdr-act { margin-left: auto; display: flex; gap: 4px; }
.hbtn { min-height: 40px; padding: 0 12px; border: 0; border-radius: 10px; background: transparent; color: #fff; font-weight: 800; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; position: relative; }
.hbtn:hover { background: rgba(255,255,255,.16); }
.hbtn:focus-visible { outline-color: #fff; }
.hbadge { min-width: 19px; height: 19px; padding: 0 5px; border-radius: 10px; background: #fff; color: var(--bad); font-size: 11.5px; font-weight: 900; display: inline-grid; place-items: center; }

main { padding-block: 16px 40px; display: flex; flex-direction: column; gap: 12px; max-width: 1600px; margin: 0 auto; }

/* Barra superior */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.mnav { display: flex; align-items: center; gap: 2px; }
.mtitle { font-family: var(--font-display); font-weight: 900; font-size: 24px; min-width: 7.6em; text-align: center; }
.ibtn { width: 40px; height: 40px; border: 0; border-radius: 10px; background: transparent; display: grid; place-items: center; color: var(--fg); }
.ibtn:hover { background: var(--surface); }
.ibtn:disabled { opacity: .35; cursor: default; }
.ctl { min-height: 42px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: 14.5px; min-width: 0; }
select.ctl { padding-right: 30px; }
.link { border: 0; background: none; color: var(--ok); font-weight: 800; padding: 6px 2px; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { min-height: 42px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-weight: 800; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; white-space: nowrap; }
.btn:hover { border-color: var(--line-strong); }
.btn:disabled { opacity: .45; cursor: default; }
.btn-pri { background: var(--oba); border-color: var(--oba); color: #fff; }
.btn-pri:hover { background: var(--oba-deep); border-color: var(--oba-deep); }
:root[data-theme="dark"] .btn-pri:hover { color: #1a0d03; }
.btn-ok { background: var(--ok); border-color: var(--ok); color: var(--bg); }
.btn-danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.seg { display: inline-flex; padding: 3px; gap: 3px; border-radius: 11px; background: var(--surface); border: 1px solid var(--line); }
.seg button { min-height: 34px; padding: 0 12px; border: 0; border-radius: 8px; background: transparent; font-weight: 800; font-size: 13.5px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--oba); color: #fff; }
.search { position: relative; flex: 1 1 180px; max-width: 260px; }
.search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
.search input { width: 100%; padding-left: 36px; }
.sync { min-height: 32px; padding: 0 11px; border-radius: 16px; font-size: 12.5px; font-weight: 800; display: inline-flex; align-items: center; gap: 6px; border: 0; }
.sync.ok { background: var(--ok-bg); color: var(--ok); }
.sync.busy { background: var(--surface); color: var(--muted); }
.sync.err { background: var(--bad-bg); color: var(--bad); }
.spin { width: 12px; height: 12px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }

.strip { display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; font-size: 13.5px; }
.strip b { font-weight: 800; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 0; background: none; padding: 4px 0; font-weight: 700; color: var(--fg); text-align: left; }
.chip.bad { color: var(--bad); } .chip.ok { color: var(--ok); } .chip.warn { color: var(--warn-fg); }

.panel { background: var(--bg); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.panel.auto { border-color: var(--oba); box-shadow: inset 4px 0 0 var(--oba); }
.panel h2 { font-size: 17px; font-weight: 900; }
.row { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.note { font-size: 13px; color: var(--muted); margin: 0; }
.check { display: flex; gap: 8px; align-items: flex-start; font-weight: 700; font-size: 14px; }
.check input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--oba); flex: none; }

/* Grade */
.gwrap { --name: 178px; --chapa: 66px; overflow: auto; max-height: calc(100vh - 230px); min-height: 260px; background: var(--bg); border: 1px solid var(--line-strong); border-radius: 10px; overscroll-behavior: contain; }
.g { border-collapse: separate; border-spacing: 0; font-size: 12.5px; font-variant-numeric: tabular-nums; min-width: 100%; }
.g th, .g td { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 0; text-align: center; }
.g thead th { position: sticky; top: 0; z-index: 3; background: var(--surface); font-weight: 800; height: 40px; border-bottom: 1.5px solid var(--line-strong); }
.g .d { min-width: 32px; line-height: 1.05; cursor: default; }
.g .d .wl { display: block; font-size: 10.5px; color: var(--muted); }
.g .d .dn { display: block; font-size: 13px; }
.g thead .sun .wl, .g thead .sun .dn { color: var(--bad); }
.g thead th.hol { background: var(--hol-bg); }
.g thead th.today { box-shadow: inset 0 -3px 0 var(--oba); }
.g .nm { position: sticky; left: 0; z-index: 2; background: var(--bg); text-align: left; padding: 3px 8px; width: var(--name); min-width: var(--name); max-width: var(--name); border-right: 1px solid var(--line-strong); }
.g .cp { position: sticky; left: var(--name); z-index: 2; background: var(--bg); width: var(--chapa); min-width: var(--chapa); font-size: 11.5px; font-weight: 700; color: var(--muted); border-right: 1.5px solid var(--line-strong); }
.g thead .nm, .g thead .cp { z-index: 4; background: var(--surface); font-size: 11.5px; }
.nmb { display: block; width: 100%; border: 0; background: none; padding: 0; text-align: left; }
.nmb .n1 { display: block; font-weight: 800; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-transform: uppercase; }
.nmb .n2 { display: block; font-size: 10.5px; color: var(--muted); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nmb:hover .n1 { text-decoration: underline; }
.g tr.sec th, .g tr.sec td { background: var(--oba); color: #fff; height: 28px; border-bottom: 0; }
.g tr.sec th, .g tr.sum th { position: sticky; left: 0; z-index: 2; width: calc(var(--name) + var(--chapa)); min-width: calc(var(--name) + var(--chapa)); max-width: calc(var(--name) + var(--chapa)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-right: 1.5px solid var(--line-strong); }
.g tr.sec th { text-align: left; padding-left: 8px; font-family: var(--font-display); font-weight: 900; font-size: 13px; letter-spacing: .03em; text-transform: uppercase; }
.g tr.sec th span { font-weight: 700; text-transform: none; letter-spacing: 0; font-size: 12px; opacity: .92; }
.g td.c { height: 34px; min-width: 32px; font-weight: 800; font-size: 11.5px; cursor: pointer; position: relative; user-select: none; -webkit-tap-highlight-color: transparent; }
.g td.c:hover { box-shadow: inset 0 0 0 2px var(--focus); }
.g td.c:focus { outline: 3px solid var(--focus); outline-offset: -3px; }
.c-T { background: var(--work-bg); color: var(--work-fg); }
.c-F { background: var(--rest-bg); color: var(--rest-fg); }
.c-D { background: var(--sun-bg); color: var(--sun-fg); }
.c-FT, .c-X, .c-C { background: var(--hol-bg); color: var(--hol-fg); }
.c-A { background: var(--abs-bg); color: var(--abs-fg); font-size: 10px !important; }
.g td.c.bad { box-shadow: inset 0 0 0 2px var(--bad); }
.g td.c.bad::after { content: ""; position: absolute; top: 0; right: 0; border-style: solid; border-width: 0 9px 9px 0; border-color: transparent var(--bad) transparent transparent; }
.g td.c.pv { box-shadow: inset 0 0 0 2px var(--oba); }
.g td.c.pv::before { content: ""; position: absolute; left: 2px; top: 2px; width: 6px; height: 6px; border-radius: 50%; background: var(--oba); }
.g td.c.saving { opacity: .55; }
.g td.c.flash { animation: flash 1s ease-out; }
@keyframes flash { from { box-shadow: inset 0 0 0 3px var(--ok); } to { box-shadow: none; } }
@media (prefers-reduced-motion: reduce) { .g td.c.flash { animation: none; } }
.g td.c.us { background-image: repeating-linear-gradient(135deg, transparent 0 6px, color-mix(in srgb, var(--line) 70%, transparent) 6px 7px); }
.g .tot { min-width: 38px; padding: 0 4px; font-size: 12px; font-weight: 800; background: var(--surface); color: var(--muted); }
.g .tot.first { border-left: 1.5px solid var(--line-strong); }
.g thead .tot b { display: block; color: var(--fg); font-size: 12px; } .g thead .tot { font-size: 10px; line-height: 1.1; }
.g .tot.tT { color: var(--work-fg); } .g .tot.tF { color: var(--rest-fg); } .g .tot.tD { color: var(--sun-fg); } .g .tot.tC { color: var(--hol-fg); }
.g tr.sum th, .g tr.sum td { background: var(--surface); font-size: 11.5px; font-weight: 800; color: var(--muted); height: 26px; }
.g tr.sum th { text-align: left; padding-left: 8px; } .g tr.sum th small { display: block; font-weight: 600; font-size: 10px; }
.g tr.sum td.low { background: var(--bad-bg); color: var(--bad); }
.g tr.sum td.hol { background: var(--hol-bg); }

.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; font-weight: 700; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { min-width: 26px; height: 20px; padding: 0 4px; border-radius: 5px; display: inline-grid; place-items: center; font-size: 10.5px; font-weight: 900; border: 1px solid var(--line); }
.sw.bad { background: var(--bg); box-shadow: inset 0 0 0 2px var(--bad); position: relative; }
.empty { background: var(--bg); border: 1px dashed var(--line-strong); border-radius: var(--r); padding: 22px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.empty h2 { font-size: 19px; }

/* Menu da célula */
.pop { position: fixed; z-index: 60; width: 320px; max-width: calc(100vw - 24px); max-height: calc(100vh - 24px); overflow: auto; background: var(--bg); border: 1px solid var(--line-strong); border-radius: 14px; box-shadow: var(--shadow); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.pop-h { display: flex; flex-direction: column; gap: 2px; }
.pop-h b { font-size: 15px; } .pop-h span { font-size: 12.5px; color: var(--muted); }
.opts { display: flex; flex-direction: column; gap: 3px; }
.opt { display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 4px 8px; border: 1px solid transparent; border-radius: 9px; background: transparent; text-align: left; font-weight: 700; font-size: 14px; }
.opt:hover, .opt:focus-visible { background: var(--surface); border-color: var(--line); }
.opt[aria-checked="true"] { border-color: var(--line-strong); background: var(--surface); }
.opt .sw { width: 38px; }
.opt .lb { flex: 1; } .opt kbd { font: 700 11px var(--font-body); color: var(--muted); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; }
.iss { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; }
.iss li { padding: 8px 10px; border-radius: 9px; }
.iss .b { background: var(--bad-bg); color: var(--bad); font-weight: 700; }
.iss .w { background: var(--warn-bg); color: var(--warn-fg); }
.iss .o { background: var(--ok-bg); color: var(--ok); }
.iss .i { background: var(--surface); color: var(--fg); }
.alts { display: flex; flex-wrap: wrap; gap: 6px; }
.alts .btn { min-height: 34px; font-size: 13px; padding: 0 10px; }
.acts { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.lbl { font-size: 12px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }

/* Gaveta / folha */
.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(15,10,5,.38); }
.sheet { position: fixed; z-index: 51; top: 0; right: 0; bottom: 0; width: min(520px, 100vw); background: var(--bg); box-shadow: var(--shadow); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.sh-h { display: flex; align-items: center; gap: 10px; padding: 12px 12px 12px 18px; border-bottom: 1px solid var(--line); }
.sh-h h2 { flex: 1; font-size: 19px; font-weight: 900; min-width: 0; }
.sh-b { overflow: auto; padding: 16px 18px 28px; display: flex; flex-direction: column; gap: 16px; }
@media (max-width: 640px) {
  .sheet { top: auto; left: 0; width: 100vw; max-height: 88vh; border-radius: 16px 16px 0 0; padding-left: env(safe-area-inset-left, 0px); }
  .pop { left: 0 !important; right: 0; bottom: 0; top: auto !important; width: 100vw; max-width: 100vw; border-radius: 16px 16px 0 0; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-height: 80vh; }
  .gwrap { --name: 132px; --chapa: 0px; max-height: calc(100vh - 170px); }
  .g .cp { display: none; }
  .mtitle { font-size: 20px; min-width: 0; }
  .hide-sm { display: none !important; }
}
.form { display: flex; flex-direction: column; gap: 12px; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field label, .field .fl { font-size: 13px; font-weight: 800; color: var(--muted); }
.field .ctl { width: 100%; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid2 > * { min-width: 0; }
.err { color: var(--bad); font-size: 12.5px; font-weight: 700; }
.list { display: flex; flex-direction: column; gap: 6px; }
.li { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); text-align: left; width: 100%; }
button.li:hover { background: var(--surface); }
.li .grow { flex: 1; min-width: 0; }
.li .t1 { font-weight: 800; } .li .t2 { font-size: 12.5px; color: var(--muted); }
.pill { display: inline-flex; padding: 2px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 800; background: var(--surface); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.pill.bad { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
.pill.warn { background: var(--warn-bg); color: var(--warn-fg); border-color: transparent; }
.pill.ok { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 13.5px; margin: 0; }
.kv dt { color: var(--muted); font-weight: 700; } .kv dd { margin: 0; font-weight: 700; min-width: 0; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.stat { background: var(--surface); border-radius: 10px; padding: 8px 4px; text-align: center; }
.stat b { display: block; font-family: var(--font-display); font-size: 20px; font-weight: 900; font-variant-numeric: tabular-nums; }
.stat span { font-size: 11.5px; font-weight: 700; color: var(--muted); }
.days { display: flex; flex-direction: column; gap: 4px; }

  db: null, user: null, canWrite: false, canAdmin: false, ready: false, offline: false,
  cfg: { storeName: '', maxConsec: 6, compPrazo: 0, rules: { ...DEF_RULES } },
  sectors: [], emps: [], esc: {}, hols: [], loaded: new Set(),
  y: +TODAY.slice(0, 4), m: +TODAY.slice(5, 7), sector: 'all', q: '', mode: 'manual',
  cursor: null, preview: null, undo: [], saving: 0, saveErr: null, pending: {}, flash: null,

// Confere uma lista de alterações antes de gravar. Bloqueios impedem; alertas pedem confirmação.

  const byEmp = {}; for (const ch of changes) (byEmp[ch.empId] = byEmp[ch.empId] || []).push(ch);
  for (const [empId, list] of Object.entries(byEmp)) {

    const ds = list.map(x => x.date).sort(); const from = add(wstart(ds[0]), -7), to = add(ds[ds.length - 1], 13);
    const before = violations(e, from, to), after = violations(e, from, to, ov);

      const prev = code(empId, ch.date);
      if (isAbs(prev) && !isAbs(ch.next)) push(ruleMode('ausencia'), `${fdw(ch.date)} está como ${CODES[prev].lb.toLowerCase()}. ${ch.next === '' ? 'Marcar trabalho' : 'Marcar ' + CODES[ch.next].lb.toLowerCase()} substitui esse registro.`);
      if (prev === 'C' && ch.next !== 'C') res.warn.push(`${fdw(ch.date)} era folga compensatória; o feriado trabalhado volta a ficar pendente.`);
      if (prev === 'FT' && ch.next !== 'FT') { const L = compLedger(empId); if (L.pairs.some(p => p[0] === ch.date)) res.warn.push(`O feriado de ${fd(ch.date)} já foi compensado; a folga compensatória correspondente fica sem crédito.`); }

    const e = empById(ch.empId); const sec = e && secById(e.sectorId); if (!sec) continue; const k = sec.id + ch.date; if (seen.has(k)) continue; seen.add(k);
    const c0 = coverage(sec, ch.date), c1 = coverage(sec, ch.date, ov);

    else if (c0.low && !c1.low) res.ok.push(`${sec.name} volta ao mínimo de ${c1.min} em ${fd(ch.date)}.`);

}
// Alternativas: outros dias da mesma semana em que a folga não deixa o setor abaixo do mínimo.
function alternatives(empId, date, next) {

  for (const d of range(wstart(date), add(wstart(date), 6))) {

    const ov = { [empId + '|' + d]: nx }; const cv = sec ? coverage(sec, d, ov) : { low: false, work: 0, min: 0 };

const queues = {};

async function applyChanges(changes, label, opts = {}) {

}

  const u = S.undo[S.undo.length - 1]; if (!u) return toast('Não há alteração para desfazer.');

async function impRun(sh) {
  const an = sh.an; const create = S.canAdmin && sh.create !== false;
  const changes = []; const start = [];
  try {
    const secIds = {}; for (const s of S.sectors) secIds[norm(s.name)] = s.id;
    const fallback = (secById(S.sector) || S.sectors[0] || {}).id;
    if (create) for (const r of an.newPeople) {
      let sid = r.secName ? secIds[norm(r.secName)] : fallback;
      if (r.secName && !sid) { sid = await dbSet('setores', null, { name: r.secName, min: 0, minDom: '', sunEvery: 0 }); secIds[norm(r.secName)] = sid; S.sectors.push({ id: sid, name: r.secName, min: 0, minDom: '', sunEvery: 0 }); }
      if (!sid) continue;
      const d = { name: r.name, chapa: r.chapa, cargo: r.cargo, sectorId: sid, sunEvery: '', active: true };
      const id = await dbSet('colaboradores', null, d); S.emps.push({ id, ...d }); r.emp = { id, ...d };
    }
  } catch (e) { return toast('A importação parou ao cadastrar: ' + errMsg(e), true); }
  if (an.days) for (const r of an.rows) {
    if (!r.emp) continue; let any = false;
    for (const [d, c] of Object.entries(r.codes)) { if (rawCode(r.emp.id, d) !== c) { changes.push({ empId: r.emp.id, date: d, next: c }); any = true; } }
    if (!any) start.push(r.emp.id);
  }
  if (an.days) goMonth(an.y, an.m);
  if (changes.length || start.length) {
    const ok = await applyChanges(changes, `Importar CSV (${sh.fileName || MESES[an.m - 1]})`, { start, ym: an.ym });
    if (ok) toast(`Importado: ${changes.length} dia(s)${create && an.newPeople.length ? ` e ${an.newPeople.filter(r => r.emp).length} pessoa(s) nova(s)` : ''}.`, false, !!changes.length);
  } else toast(create && an.newPeople.length ? `${an.newPeople.filter(r => r.emp).length} colaborador(es) cadastrado(s).` : 'Nada mudou: a escala já estava igual ao arquivo.');
  render();
}

async function backupRestore(b) {
  if (!S.db) return toast('Sem armazenamento: nada foi restaurado.', true);
  const ok = id => typeof id === 'string' && /^[A-Za-z0-9_\-.~:@+]{1,200}$/.test(id);
  let n = 0;
  try {
    for (const col of ['setores', 'colaboradores', 'feriados']) for (const d of b[col] || []) { if (!ok(d.id)) continue; const { id, ...r } = d; await S.db.collection(col).doc(id).set(r); n++; }
    if (b.config && typeof b.config === 'object') { await S.db.doc('config/app').set(b.config); n++; }
    for (const d of b.escala || []) { if (!ok(d.id) || !d.empId || !/^\d{4}-\d{2}$/.test(d.ym || '')) continue; await S.db.collection('escala').doc(d.id).set({ empId: d.empId, ym: d.ym, days: d.days || {}, updatedAt: new Date().toISOString() }); n++; }
  } catch (e) { return toast(`A restauração parou depois de ${n} registro(s): ${errMsg(e)}`, true); }

}

      const er = {}; if (d.name.length < 2) er.name = 'Informe o nome do setor.'; else if (S.sectors.some(s => s.id !== sh.id && norm(s.name) === norm(d.name))) er.name = 'Já existe um setor com esse nome.';

async function offerFile(filename, data) {

function exportCsv() {
  const first = iso(S.y, S.m, 1), last = iso(S.y, S.m, dim(S.y, S.m)); const days = range(first, last);
  const q = s => '"' + String(s).replace(/"/g, '""') + '"';
  const lines = [['Setor', 'Colaborador', 'Chapa', 'Cargo', ...days.map(d => WD3[wd(d)] + ' ' + fd(d)), 'Trabalho', 'Folgas', 'Domingos livres'].map(q).join(';')];
  for (const sec of visibleSectors()) for (const e of visibleEmps().filter(x => x.sectorId === sec.id).sort((a, b) => a.name.localeCompare(b.name, 'pt-BR'))) {
    const cs = days.map(d => code(e.id, d));
    lines.push([sec.name, e.name, e.chapa || '', e.cargo || '', ...cs.map(c => c === '' ? 'T' : CODES[c].sh), cs.filter(isWork).length, cs.filter(isRest).length, days.filter((d, i) => wd(d) === 6 && !isWork(cs[i])).length].map(q).join(';'));

}

  if (a === 'backupGo') { const sh = S.sheet; if (!sh || sh.kind !== 'backup' || el.disabled) return; el.disabled = true; closeSheet(); return backupRestore(sh.data); }
  if (a === 'delHol') { try { await S.db.collection('feriados').doc(el.dataset.id).delete(); toast('Feriado removido.'); } catch (e) { toast('Não foi removido: ' + errMsg(e), true); } return; }
  if (a === 'ignHol') { try { await dbSet('feriados', null, { date: el.dataset.d, name: '', ignore: true }); toast('Feriado desconsiderado nesta loja.'); } catch (e) { toast('Não foi salvo: ' + errMsg(e), true); } return; }
  if (a === 'goAlert') {
    const al = monthAlerts().list.filter(x => !S.sheet.rule || x.rule === S.sheet.rule)[+el.dataset.i]; closeSheet(); if (!al) return;
    if (al.empId) { S.cursor = al.empId + '|' + al.date; S.focusGrid = true; render(); const c = document.querySelector(`td.c[data-e="${CSS.escape(al.empId)}"][data-d="${al.date}"]`); if (c) { c.scrollIntoView({ block: 'nearest', inline: 'center' }); c.focus({ preventScroll: true }); } }
    else { const th = document.querySelector(`th[data-date="${al.date}"]`); if (th) th.scrollIntoView({ block: 'nearest', inline: 'center' }); }
    return;
  }
  if (a === 'confirmYes') { const fn = S.sheet && S.sheet.onYes; closeSheet(); if (fn) fn(); }
});
document.addEventListener('submit', ev => { const f = ev.target.closest('form[data-form]'); if (!f) return; ev.preventDefault(); submitForm(f); });
document.addEventListener('change', ev => {
  const t = ev.target; const k = t.dataset && t.dataset.ch; if (!k) return;
  if (k === 'month' && /^\d{4}-\d{2}$/.test(t.value)) return goMonth(+t.value.slice(0, 4), +t.value.slice(5, 7));
  if (k === 'impFile') {
    const sh = S.sheet; const f = t.files && t.files[0]; if (!sh || !f) return;
    if (f.size > 2 * 1024 * 1024) { sh.an = null; sh.err = 'Arquivo grande demais (máximo 2 MB).'; return renderSheet(); }
    const rd = new FileReader();
    rd.onload = () => { let txt = String(rd.result || ''); if (txt.includes('\ufffd')) { const r2 = new FileReader(); r2.onload = () => { done(String(r2.result || '')); }; r2.readAsText(f, 'windows-1252'); return; } done(txt); };
    const done = txt => { const an = impAnalyze(txt); if (an.error) { sh.an = null; sh.err = an.error; } else { sh.an = an; sh.err = null; } sh.fileName = f.name; renderSheet(); };
    rd.onerror = () => { sh.an = null; sh.err = 'Não foi possível ler o arquivo.'; renderSheet(); };
    rd.readAsText(f, 'utf-8'); return;
  }
  if (k === 'backupIn') {
    const f = t.files && t.files[0]; if (!f) return;
    f.text().then(txt => { let b; try { b = JSON.parse(txt); } catch (e) { b = null; }
      if (!b || b.app !== 'oba-escala') return toast('Este arquivo não é um backup do Oba Escala.', true);
      openSheet('backup', { data: b, fileName: f.name }); }).catch(() => toast('Não foi possível ler o arquivo.', true));
    return;
  }
  if (k === 'impNew') { const sh = S.sheet; if (sh && sh.kind === 'imp') { sh.create = t.checked; sh.focus = '#impNew'; renderSheet(); } return; }
  if (k === 'clEmp' || k === 'clAbs' || k === 'clHol') { const sh = S.sheet; if (!sh || sh.kind !== 'clear') return; if (k === 'clEmp') sh.emp = t.value; if (k === 'clAbs') sh.keepAbs = t.checked; if (k === 'clHol') sh.keepHol = t.checked; sh.focus = '#' + t.id; return renderSheet(); }
  if (k === 'sector') { S.sector = t.value; S.preview = null; S.simStart = null; saveView(); return render(); }
});
let qT;
document.addEventListener('input', ev => {
  if (ev.target.dataset && ev.target.dataset.in === 'q') { clearTimeout(qT); const v = ev.target.value; qT = setTimeout(() => { S.q = v; render(); const i = document.getElementById('fQ'); if (i) { i.focus(); i.setSelectionRange(v.length, v.length); } }, 200); }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape') { if (S.menu) { ev.preventDefault(); return closeMenu(); } if (S.sheet) { ev.preventDefault(); return closeSheet(); } if (S.full) { ev.preventDefault(); return exitFull(); } }
  const tag = (ev.target.tagName || '');
  if ((ev.ctrlKey || ev.metaKey) && !ev.shiftKey && ev.key.toLowerCase() === 'z' && !/INPUT|TEXTAREA|SELECT/.test(tag) && !S.sheet && !S.menu) { ev.preventDefault(); return undoLast(); }
  const pop = document.getElementById('pop');
  if (pop && pop.contains(ev.target)) {
    if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') { const b = [...pop.querySelectorAll('.opt, .acts .btn, .alts .btn')]; const i = b.indexOf(document.activeElement); if (b.length) { ev.preventDefault(); b[(i + (ev.key === 'ArrowDown' ? 1 : -1) + b.length) % b.length].focus(); } }
    else if (S.menu && S.menu.step === 'opts' && ev.key.length === 1 && !ev.ctrlKey && !ev.metaKey) { const c = Object.keys(CODES).find(x => CODES[x].key === ev.key.toLowerCase()); if (c != null && menuOptions(S.menu.date).includes(c)) { ev.preventDefault(); pick(c); } }
    return;
  }
  const cell = ev.target.closest && ev.target.closest('td.c'); if (!cell) return;
  const row = cell.parentElement; const cells = [...row.querySelectorAll('td.c')]; const i = cells.indexOf(cell); let next = null;
  if (ev.key === 'ArrowRight') next = cells[i + 1]; else if (ev.key === 'ArrowLeft') next = cells[i - 1];
  else if (ev.key === 'Home') next = cells[0]; else if (ev.key === 'End') next = cells[cells.length - 1];
  else if (ev.key === 'ArrowDown' || ev.key === 'ArrowUp') { let r = row; do { r = ev.key === 'ArrowDown' ? r.nextElementSibling : r.previousElementSibling; } while (r && !r.querySelector('td.c')); if (r) next = r.querySelectorAll('td.c')[i]; }
  if (next) { ev.preventDefault(); cell.tabIndex = -1; next.tabIndex = 0; next.focus(); S.cursor = next.dataset.e + '|' + next.dataset.d; return; }
  if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); return openMenu(cell.dataset.e, cell.dataset.d, cell); }
  if (ev.ctrlKey || ev.metaKey || ev.altKey || !S.canWrite || S.preview) return;
  if (ev.key.length === 1 && quickSet(cell.dataset.e, cell.dataset.d, ev.key)) ev.preventDefault();
});
window.addEventListener('resize', () => { if (S.full) { const was = document.body.classList.contains('rot'); applyFullClasses(); if (was !== isRot()) { render(); if (S.menu) showMenu(); return; } } if (S.menu && !gNarrow()) showMenu(); });

(async function boot() {
  render();
  const L = window.__obaLocal; S.local = !!L;
  const [db, user, downloads] = L ? [L.db, null, L.downloads] : await Promise.all([window.claude.use('db'), window.claude.use('user'), window.claude.use('downloads')]);
  S.db = db; S.user = user; S.downloads = downloads;
  if (!db) { S.ready = true; S.offline = true; render(); toast('Não foi possível acessar o armazenamento compartilhado. Entre com sua conta para salvar as alterações.', true); return; }
  if (user) {
    const [own, edit, w] = await Promise.all([user.isOwner(), user.canEdit(), user.can('data.write')]);
    S.canAdmin = !!(own || edit); S.canWrite = S.canAdmin || w !== false;
    try { S.myId = await user.id(); } catch (e) {}
  } else { S.canWrite = true; S.canAdmin = true; }
  const need = ['setores', 'colaboradores', 'escala', 'feriados', 'config'];
  const done = n => { S.loaded.add(n); if (need.every(x => S.loaded.has(x))) S.ready = true; scheduleRender(); };
  const fail = e => { S.ready = true; S.saveErr = errMsg(e); scheduleRender(); };
  db.collection('setores').onSnapshot(s => { S.sectors = s.docs.map(d => ({ id: d.id, ...d.data() })).filter(x => x.name); done('setores'); }, fail);
  db.collection('colaboradores').onSnapshot(s => { S.emps = s.docs.map(d => ({ id: d.id, ...d.data() })).filter(x => x.name); done('colaboradores'); }, fail);
  db.collection('escala').onSnapshot(s => {
    const next = {}; for (const d of s.docs) { const v = d.data(); if (v && v.empId) next[d.id] = { empId: v.empId, ym: v.ym, days: v.days || {} }; }
    // Mantém documentos ainda não confirmados pelo servidor
    for (const [k, v] of Object.entries(S.esc)) if (v.local && !next[k]) next[k] = v;
    S.esc = next; done('escala');
  }, fail);
  db.collection('feriados').onSnapshot(s => { S.hols = s.docs.map(d => ({ id: d.id, ...d.data() })).filter(x => x.date); resetHolCache(); done('feriados'); }, fail);
  db.doc('config/app').onSnapshot(s => { const v = s.exists ? s.data() : {}; S.cfg = { storeName: '', maxConsec: 6, compPrazo: 0, ...v, rules: { ...DEF_RULES, ...((v && v.rules) || {}) } }; done('config'); }, fail);
})();
let rT = null;
function scheduleRender() { if (rT) return; rT = requestAnimationFrame(() => { rT = null; render(); if (S.sheet && !document.activeElement.closest('.sheet form')) renderSheet(); if (S.menu) showMenu(); }); }
</script>
